[package]
name = "mwcc-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
# (mw-ninja, src/bin/mw-ninja.rs, is `mwcc-tools run ninja`)
default-run = "mwcc-tools"

[dependencies]
tempfile.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sha1.workspace = true
zip.workspace = true
ureq.workspace = true
mwcc-oracle-core = { path = "../mwcc-oracle-core" }
mwcc-project = { path = "../mwcc-project" }
mwcc-methods = { path = "../mwcc-methods" }
mwcc-ninja = { path = "../mwcc-ninja" }
mwcc-wasm = { path = "../mwcc-wasm", optional = true }

[features]
default = ["wasm"]
# The compilers of gc2's sources (GC 2.6, 2.7) run in process, as WebAssembly, where their modules are built
wasm = ["mwcc-oracle-core/wasm", "dep:mwcc-wasm"]
