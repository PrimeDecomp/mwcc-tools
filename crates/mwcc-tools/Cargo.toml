[package]
name = "mwcc-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tempfile.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
mwcc-oracle-core = { path = "../mwcc-oracle-core" }
mwcc-wasm = { path = "../mwcc-wasm", optional = true }

[features]
# `corpus --wasm MODULE`: the GC 2.7 compiler built from gc2 for wasm32, run in process (wasmtime)
wasm = ["dep:mwcc-wasm"]
