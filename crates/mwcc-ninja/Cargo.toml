[package]
name = "mwcc-ninja"
description = "A ninja build engine that runs commands through a caller's executor: a fork of n2 (https://github.com/evmar/n2)"
version.workspace = true
# (n2's edition, as forked)
edition = "2021"
# (n2's license; see licenses/README.md)
license = "Apache-2.0"
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
lexopt = "0.3.0"
libc = "0.2"
rustc-hash = "2.1.3"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.52"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Pipes",
  "Win32_System_Threading",
]

[dev-dependencies]
tempfile.workspace = true
