[package]
name = "mwcc-project"
description = "A decomp project's units as its build compiles them (objdiff.json, build.ninja, report.json), and their compiles: in process where a module runs the project's compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# serde_json at its default features, so that a dependent's own JSON is as it would be without this crate.
[dependencies]
anyhow.workspace = true
regex.workspace = true
serde.workspace = true
serde_json = "1.0.145"
sha1.workspace = true
tempfile.workspace = true
mwcc-trace = { path = "../mwcc-trace" }
mwcc-wasm = { path = "../mwcc-wasm" }
