[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mwcc-tools"
version = "0.4.4"
description = "The mwcc engine from Python: a client of `mwcc-tools serve`"
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools]
packages = ["mwcc_tools"]
