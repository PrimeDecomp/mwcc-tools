name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  # (no debug info in dev builds: they are only checked, tested and used to run configure, and build faster)
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            executable: mwcc-tools.exe
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable: mwcc-tools
            check: true
          - os: macos-15
            target: aarch64-apple-darwin
            executable: mwcc-tools
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install the pinned Rust toolchain
        run: |
          rustup show
          rustup component add rust-docs

      # (the dependencies' builds and the cargo registry, by OS, toolchain and Cargo.lock; saved from main only)
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting, lints and tests
        if: matrix.check
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          python -m unittest discover -s python/tests -p 'test_*.py'

      - name: Build
        run: cargo build --locked --release -p mwcc-tools

      # (the locked dependencies' notices and the pinned toolchain's library notices, from this runner)
      - name: Collect the dependency notices
        run: |
          cargo fetch --locked --target ${{ matrix.target }}
          python tools/migration/capture_notices.py --target ${{ matrix.target }} --output build/notices/${{ matrix.target }}

      - name: Package
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          target/release/${{ matrix.executable }} package-release "build/releases/mwcc-tools-$version-${{ matrix.target }}.zip" \
            --binary target/release/${{ matrix.executable }} --target ${{ matrix.target }} \
            --source-revision "$GITHUB_SHA"
            
      - uses: actions/upload-artifact@v7
        with:
          name: mwcc-tools-${{ matrix.target }}
          path: build/releases/
          if-no-files-found: error

  # GC 2.7's compiler built from gc2/ as WebAssembly (docs/wasm.md): mwcc.wasm (with its .version), which mwcc-tools
  # runs in process, and mwcceppc.wasm, oracle.wasm and persist.wasm, which mwdec loads. The archive keeps their
  # paths, so it unpacks into a checkout (or MWCC_ORACLE_ROOT).
  wasm:
    runs-on: ubuntu-24.04
    env:
      # (the hooks' IR is LLVM 22's, as Rust's: clang reads it)
      CLANG: clang-22
      WASM_LD: wasm-ld-22
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install ninja and LLVM 22 (clang, wasm-ld)
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 22
          sudo apt-get install -y lld-22

      - name: Install the pinned Rust toolchain
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # (a dev build of mwcc-tools: it only runs configure and ninja's light steps, such as building the hooks)
      - name: Build
        run: |
          cargo build --locked -p mwcc-tools
          target/debug/mwcc-tools configure --version GC_2_7
          ninja build/GC_2_7/wasm/mwcc.wasm build/GC_2_7/wasm/mwcceppc.wasm build/GC_2_7/wasm/oracle.wasm \
            build/GC_2_7/wasm/persist.wasm

      - name: Package
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          mkdir -p build/releases
          archive="build/releases/mwcc-wasm-GC_2_7-$version.zip"
          zip -X "$archive" LICENSE build/GC_2_7/wasm/mwcc.wasm build/GC_2_7/wasm/mwcc.version \
            build/GC_2_7/wasm/mwcceppc.wasm build/GC_2_7/wasm/oracle.wasm build/GC_2_7/wasm/persist.wasm
          (cd build/releases && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: mwcc-wasm-GC_2_7
          path: build/releases/
          if-no-files-found: error

  publish:
    needs: [binaries, wasm]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: release-input
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          test "$TAG" = "v$version" || { echo "the tag must be v$version"; exit 1; }
          files=(release-input/*/*.zip release-input/*/*.zip.sha256)
          test "${#files[@]}" -eq 8 || { echo "expected 4 archives and their checksums: ${files[*]}"; exit 1; }
          options=(--verify-tag --generate-notes --title "mwcc-tools $version")
          if [[ "${version%%+*}" == *-* ]]; then
            options+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" "${options[@]}" "${files[@]}"
