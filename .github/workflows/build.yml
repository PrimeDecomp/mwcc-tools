name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  # (no debug info in dev builds: they are only checked, tested and used to run configure, and build faster)
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # (its own job, so the Linux release build runs beside the others instead of after these)
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install the pinned Rust toolchain
        run: rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Check formatting, lints and tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          python -m unittest discover -s python/tests -p 'test_*.py'

  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            executable: mwcc-tools.exe
            ninja: mw-ninja.exe
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable: mwcc-tools
            ninja: mw-ninja
          - os: macos-15
            target: aarch64-apple-darwin
            executable: mwcc-tools
            ninja: mw-ninja
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install the pinned Rust toolchain
        run: |
          rustup show
          rustup component add rust-docs

      # (the dependencies' builds and the cargo registry, by OS, toolchain and Cargo.lock; saved from main only)
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # (mwcc-tools and mw-ninja, its launcher of `mwcc-tools run ninja`)
      - name: Build
        run: cargo build --locked --release -p mwcc-tools

      # (the locked dependencies' notices and the pinned toolchain's library notices, from this runner)
      - name: Collect the dependency notices
        run: |
          cargo fetch --locked --target ${{ matrix.target }}
          python tools/migration/capture_notices.py --target ${{ matrix.target }} --output build/notices/${{ matrix.target }}

      - name: Package
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          target/release/${{ matrix.executable }} package-release "build/releases/mwcc-tools-$version-${{ matrix.target }}.zip" \
            --binary target/release/${{ matrix.executable }} --ninja target/release/${{ matrix.ninja }} \
            --target ${{ matrix.target }} \
            --source-revision "$GITHUB_SHA"
            
      - uses: actions/upload-artifact@v7
        with:
          name: mwcc-tools-${{ matrix.target }}
          path: build/releases/
          if-no-files-found: error

  # GC 2.7's, 2.6's and 1.3.2's compilers built from gc2/ as WebAssembly (docs/wasm.md): mwcc.wasm (with its
  # .version), which mwcc-tools runs in process, and mwcceppc.wasm, oracle.wasm and persist.wasm, which mwdec loads;
  # and for 2.7 and 1.3.2, the version's linker built from src/linker (mwldeppc.wasm and its .version). GC 1.2.5n's compiler is built from src/
  # (mwcc.wasm and its .version only). The archive keeps their paths, so it unpacks into a checkout (or
  # MWCC_ORACLE_ROOT).
  wasm:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: GC_2_7
            files: >-
              build/GC_2_7/wasm/mwcc.wasm build/GC_2_7/wasm/mwcc.version build/GC_2_7/wasm/mwcceppc.wasm
              build/GC_2_7/wasm/oracle.wasm build/GC_2_7/wasm/persist.wasm
              build/LD_2_7/wasm/mwldeppc.wasm build/LD_2_7/wasm/mwldeppc.version
          - version: GC_2_6
            files: >-
              build/GC_2_6/wasm/mwcc.wasm build/GC_2_6/wasm/mwcc.version build/GC_2_6/wasm/mwcceppc.wasm
              build/GC_2_6/wasm/oracle.wasm build/GC_2_6/wasm/persist.wasm
          - version: GC_1_3_2
            files: >-
              build/GC_1_3_2/wasm/mwcc.wasm build/GC_1_3_2/wasm/mwcc.version build/GC_1_3_2/wasm/mwcceppc.wasm
              build/GC_1_3_2/wasm/oracle.wasm build/GC_1_3_2/wasm/persist.wasm
              build/LD_1_3_2/wasm/mwldeppc.wasm build/LD_1_3_2/wasm/mwldeppc.version
          - version: GC_1_2_5n
            files: build/GC_1_2_5n/wasm/mwcc.wasm build/GC_1_2_5n/wasm/mwcc.version
    env:
      # (the hooks' IR is LLVM 22's, as Rust's: clang reads it)
      CLANG: clang-22
      WASM_LD: wasm-ld-22
      WASM_OPT: ${{ github.workspace }}/binaryen/bin/wasm-opt
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install ninja and LLVM 22 (clang, wasm-ld)
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          sudo bash llvm.sh 22
          sudo apt-get install -y lld-22

      # (each module is wasm-opt's -O3 of its link: crates/mwcc-oracle-core/src/wasm_build.rs, OPT_FLAGS)
      - name: Install binaryen (wasm-opt), pinned
        run: |
          archive=binaryen-version_133-x86_64-linux.tar.gz
          wget -q "https://github.com/WebAssembly/binaryen/releases/download/version_133/$archive"
          echo "2dc9c7813f5375db93d96ead4b78222fcc3e2677bbb832297af4797782a37489  $archive" | sha256sum -c -
          mkdir binaryen && tar -xzf "$archive" -C binaryen --strip-components=1
          binaryen/bin/wasm-opt --version

      - name: Install the pinned Rust toolchain
        run: |
          rustup show
          rustup target add wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # (a dev build of mwcc-tools: it only runs configure and ninja's light steps, such as building the hooks)
      - name: Build
        run: |
          cargo build --locked -p mwcc-tools
          target/debug/mwcc-tools configure --version ${{ matrix.version }}
          files="${{ matrix.files }}"
          # (with each module's check for calls that trap, on its link: crates/mwcc-oracle-core/src/wasm_build.rs,
          # check_stubs)
          ninja $files $(for f in $files; do case $f in *.wasm) echo "$(dirname $f)/linked/$(basename $f).stubs";; esac; done)

      - name: Package
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          mkdir -p build/releases
          archive="build/releases/mwcc-wasm-${{ matrix.version }}-$version.zip"
          zip -X "$archive" LICENSE ${{ matrix.files }}
          (cd build/releases && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")

      - uses: actions/upload-artifact@v7
        with:
          name: mwcc-wasm-${{ matrix.version }}
          path: build/releases/
          if-no-files-found: error

  publish:
    needs: [check, binaries, wasm]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: release-input
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          test "$TAG" = "v$version" || { echo "the tag must be v$version"; exit 1; }
          files=(release-input/*/*.zip release-input/*/*.zip.sha256)
          test "${#files[@]}" -eq 14 || { echo "expected 7 archives and their checksums: ${files[*]}"; exit 1; }
          # (the installers, as releases/latest/download/install.sh and install.ps1)
          files+=(install.sh install.ps1)
          options=(--verify-tag --generate-notes --title "mwcc-tools $version")
          if [[ "${version%%+*}" == *-* ]]; then
            options+=(--prerelease --latest=false)
          fi
          gh release create "$TAG" "${options[@]}" "${files[@]}"
